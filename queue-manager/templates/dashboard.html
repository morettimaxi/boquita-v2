<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎫 Dashboard Boca Juniors - Sistema de Gestión de Sesiones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #005ca9 0%, #003d73 50%, #001f3d 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }

        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(90deg, #005ca9 0%, #ffd700 50%, #005ca9 100%);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 5px solid #ffd700;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .boca-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 50%;
            border: 3px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: white;
            padding: 8px;
        }

        .header h1 {
            color: #005ca9;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .header p {
            color: #005ca9;
            font-size: 1.3em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }

        .controls {
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 5px solid #ffd700;
        }

        .control-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        .control-group {
            flex: 1;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #005ca9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 15px;
            border: 3px solid #005ca9;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            background: white;
            color: #005ca9;
        }

        .control-group input:focus, .control-group select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 3px solid transparent;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(45deg, #005ca9, #003d73);
            color: #ffd700;
            border-color: #ffd700;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #003d73, #001f3d);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #dc3545, #c82333);
            color: white;
            border-color: #dc3545;
        }

        .btn-success {
            background: linear-gradient(45deg, #28a745, #218838);
            color: white;
            border-color: #28a745;
        }

        .btn-warning {
            background: linear-gradient(45deg, #ffd700, #ffb300);
            color: #005ca9;
            border-color: #005ca9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border: 3px solid #ffd700;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: shimmer 4s infinite;
        }

        .stat-number {
            font-size: 3em;
            font-weight: 900;
            color: #005ca9;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
        }

        .stat-label {
            font-size: 1.1em;
            color: #005ca9;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        .countdown {
            background: linear-gradient(145deg, #005ca9 0%, #003d73 100%);
            color: #ffd700;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            font-weight: 900;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border: 3px solid #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .countdown.open {
            background: linear-gradient(45deg, #28a745, #218838);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .session-card {
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border: 3px solid #005ca9;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .session-card.best {
            border: 5px solid #ffd700;
            background: linear-gradient(135deg, #fffbf0 0%, #fff8e1 100%);
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.4);
        }

        .session-card.best::before {
            content: "⭐ MEJOR";
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(45deg, #ffd700, #ffb300);
            color: #005ca9;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #005ca9;
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .session-title {
            font-size: 1.5em;
            font-weight: 900;
            color: #005ca9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .session-status {
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
        }

        .status-waiting {
            background: linear-gradient(45deg, #ffd700, #ffb300);
            color: #005ca9;
            border-color: #005ca9;
        }

        .status-active {
            background: linear-gradient(45deg, #005ca9, #003d73);
            color: #ffd700;
            border-color: #ffd700;
        }

        .status-ready {
            background: linear-gradient(45deg, #28a745, #218838);
            color: white;
            border-color: #28a745;
        }

        .status-error {
            background: linear-gradient(45deg, #dc3545, #c82333);
            color: white;
            border-color: #dc3545;
        }

        .session-info {
            margin-bottom: 25px;
        }

        .session-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .session-info-label {
            font-weight: 700;
            color: #005ca9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .session-info-value {
            font-weight: 900;
            color: #333;
        }

        .queue-id {
            font-family: 'Courier New', monospace;
            background: linear-gradient(145deg, #005ca9, #003d73);
            color: #ffd700;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            border: 2px solid #ffd700;
        }

        .wait-time {
            font-size: 1.8em;
            font-weight: 900;
            color: #005ca9;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .session-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-sm {
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-highlight {
            animation: pulse-red 2s infinite;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 5px rgba(220, 53, 69, 0.5); }
            50% { box-shadow: 0 0 15px rgba(220, 53, 69, 0.8); }
            100% { box-shadow: 0 0 5px rgba(220, 53, 69, 0.5); }
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #ffd700;
            font-size: 1.5em;
            font-weight: 700;
        }

        .status-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid #ffd700;
        }

        .status-indicator.online {
            background: #28a745;
            box-shadow: 0 0 15px #28a745;
            animation: pulse 2s infinite;
        }

        .status-indicator.offline {
            background: #dc3545;
            box-shadow: 0 0 15px #dc3545;
        }

        .loading-pulse {
            animation: pulse 2s infinite;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            border-radius: 15px;
            color: white;
            font-weight: 700;
            z-index: 1000;
            transition: all 0.3s;
            border: 3px solid transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .notification.success {
            background: linear-gradient(45deg, #28a745, #218838);
            border-color: #28a745;
        }

        .notification.error {
            background: linear-gradient(45deg, #dc3545, #c82333);
            border-color: #dc3545;
        }

        .notification.info {
            background: linear-gradient(45deg, #005ca9, #003d73);
            border-color: #ffd700;
        }

        .xeneize-pride {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(45deg, #ffd700, #ffb300);
            color: #005ca9;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.1em;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            border: 3px solid #005ca9;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .controls { padding: 25px; }
            .control-row { flex-direction: column; }
            .button-group { flex-direction: column; }
            .sessions-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 20px; }
            .session-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTh3htJ-1RtrHP8Tyyh7QzqxGK8ebx4G6xYYA&s" 
                 alt="Escudo Boca Juniors" class="boca-logo">
            <h1>🎫 SISTEMA DE GESTIÓN BOCA JUNIORS</h1>
            <p>Automatización completa para la venta de entradas xeneize</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="targetUrl">🌐 URL del Sistema de Entradas</label>
                    <input type="url" id="targetUrl" value="http://localhost:8000/boca.html" 
                           placeholder="https://tickets.bocajuniors.com.ar">
                </div>
                <div class="control-group">
                    <label for="openingTime">⏰ Hora de Apertura</label>
                    <input type="time" id="openingTime" value="13:00">
                </div>
                <div class="control-group">
                    <label for="sessionCount">🔢 Número de Sesiones</label>
                    <input type="number" id="sessionCount" value="5" min="1" max="20">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="startSessions()">
                    🚀 Iniciar Sesiones
                </button>
                <button class="btn btn-danger" onclick="stopSessions()">
                    ⏹️ Detener Todo
                </button>
                <button class="btn btn-success" onclick="openBestSession()">
                    ⭐ Abrir Mejor Sesión
                </button>
                <button class="btn btn-primary" onclick="quickRefresh()" style="background: linear-gradient(45deg, #17a2b8, #138496); border-color: #17a2b8;">
                    👁️ Ver Datos (rápido)
                </button>
                <button class="btn btn-warning" onclick="manualRefresh()">
                    ⚡ Forzar Actualización
                </button>
            </div>
            
            <div class="button-group" style="margin-top: 15px;">
                <button class="btn btn-success" onclick="openTopSessions(3)">
                    🏆 Abrir Top 3
                </button>
                <button class="btn btn-success" onclick="openTopSessions(5)">
                    🏆 Abrir Top 5
                </button>
                <button class="btn btn-primary" onclick="openCustomSessions()">
                    🎯 Abrir Seleccionadas
                </button>
                <button class="btn btn-warning" onclick="showTopSessions()">
                    📊 Ver Mejores
                </button>
                <button class="btn btn-success" onclick="openBestUI(5)" style="background: linear-gradient(45deg, #ff6b6b, #ffd700); color: #005ca9; font-weight: 900;">
                    🖥️ Abrir 5 Mejores en UI
                </button>
            </div>
        </div>

        <!-- Countdown -->
        <div class="countdown" id="countdown">
            ⏰ Sistema iniciando...
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalSessions">0</div>
                <div class="stat-label">Sesiones Totales</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeSessions">0</div>
                <div class="stat-label">Sesiones Activas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="waitingSessions">0</div>
                <div class="stat-label">Esperando</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="readySessions">0</div>
                <div class="stat-label">Listas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="bestTime">--</div>
                <div class="stat-label">Mejor Tiempo</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgTime">--</div>
                <div class="stat-label">Tiempo Promedio</div>
            </div>
        </div>

        <!-- Sessions Grid -->
        <div class="sessions-grid" id="sessionsGrid">
            <div class="loading">
                <div class="loading-pulse">
                    💙 Esperando sesiones xeneize... 💛
                </div>
            </div>
        </div>
    </div>

    <div class="xeneize-pride">
        💙 DALE BOCA DALE 💛
    </div>

    <script>
        let refreshInterval;
        let isRunning = false;

        // Función para mostrar notificaciones
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 4000);
        }

        // Función para copiar al clipboard
        async function copyToClipboard(text, sessionId) {
            try {
                await navigator.clipboard.writeText(text);
                showNotification(`✅ Link de sesión ${sessionId} copiado al portapapeles!`, 'success');
            } catch (err) {
                // Fallback para navegadores que no soportan clipboard API
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showNotification(`✅ Link de sesión ${sessionId} copiado al portapapeles!`, 'success');
                } catch (err) {
                    showNotification('❌ Error copiando al portapapeles', 'error');
                }
                document.body.removeChild(textArea);
            }
        }

        // Iniciar sesiones
        async function startSessions() {
            const targetUrl = document.getElementById('targetUrl').value;
            const openingTime = document.getElementById('openingTime').value;
            const sessionCount = parseInt(document.getElementById('sessionCount').value);

            if (!targetUrl) {
                showNotification('Por favor ingresa la URL del sistema', 'error');
                return;
            }

            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        target_url: targetUrl,
                        opening_time: openingTime,
                        session_count: sessionCount
                    })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    showNotification('🎫 ' + result.message, 'success');
                    isRunning = true;
                    startDataRefresh();
                } else {
                    showNotification('❌ Error iniciando sesiones', 'error');
                }
            } catch (error) {
                showNotification('❌ Error de conexión', 'error');
                console.error('Error:', error);
            }
        }

        // Detener sesiones
        async function stopSessions() {
            try {
                const response = await fetch('/api/stop', {
                    method: 'POST'
                });

                const result = await response.json();
                showNotification('🛑 ' + result.message, 'success');
                isRunning = false;
                stopDataRefresh();
                
                // Limpiar interfaz
                document.getElementById('sessionsGrid').innerHTML = `
                    <div class="loading">
                        <div class="loading-pulse">
                            💙 Esperando sesiones xeneize... 💛
                        </div>
                    </div>
                `;
                
                // Resetear stats
                updateStats({});
                
            } catch (error) {
                showNotification('❌ Error deteniendo sesiones', 'error');
                console.error('Error:', error);
            }
        }

        // Abrir mejor sesión
        async function openBestSession() {
            try {
                const response = await fetch('/api/best');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const sessionId = result.session.id;
                    await focusSession(sessionId);
                    showNotification(`⭐ Abriendo sesión ${sessionId} (${result.session.wait_time} min)`, 'success');
                } else {
                    showNotification('❌ No hay sesiones disponibles', 'error');
                }
            } catch (error) {
                showNotification('❌ Error obteniendo mejor sesión', 'error');
                console.error('Error:', error);
            }
        }

        // Abrir las mejores N sesiones
        async function openTopSessions(count) {
            try {
                const response = await fetch(`/api/open_top_sessions/${count}`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    const sessionsInfo = result.sessions.map(s => 
                        `Sesión ${s.id} (${s.wait_time} min)`
                    ).join(', ');
                    
                    showNotification(`🏆 ${result.message}: ${sessionsInfo}`, 'success');
                } else {
                    showNotification('❌ No hay sesiones disponibles', 'error');
                }
            } catch (error) {
                showNotification('❌ Error abriendo sesiones', 'error');
                console.error('Error:', error);
            }
        }

        // Abrir sesiones seleccionadas manualmente
        async function openCustomSessions() {
            try {
                const response = await fetch('/api/sessions');
                const data = await response.json();
                
                if (!data.sessions || data.sessions.length === 0) {
                    showNotification('❌ No hay sesiones disponibles', 'error');
                    return;
                }

                // Crear dialog para seleccionar sesiones
                const sessionsWithTimes = data.sessions.filter(s => s.wait_time !== null);
                if (sessionsWithTimes.length === 0) {
                    showNotification('❌ No hay sesiones con tiempos disponibles', 'error');
                    return;
                }

                const sessionOptions = sessionsWithTimes.map(s => 
                    `${s.id}: ${s.wait_time} min (${s.queue_id})`
                ).join('\\n');

                const selectedIds = prompt(
                    `🎯 Selecciona las sesiones a abrir (separadas por comas):\\n\\n${sessionOptions}\\n\\nEjemplo: 0,2,4`
                );

                if (selectedIds) {
                    const sessionIds = selectedIds.split(',').map(id => parseInt(id.trim()));
                    
                    const focusResponse = await fetch('/api/focus_multiple', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            session_ids: sessionIds
                        })
                    });
                    
                    const focusResult = await focusResponse.json();
                    showNotification('✅ ' + focusResult.message, 'success');
                }
            } catch (error) {
                showNotification('❌ Error abriendo sesiones seleccionadas', 'error');
                console.error('Error:', error);
            }
        }

        // Mostrar información de las mejores sesiones
        async function showTopSessions() {
            try {
                const response = await fetch('/api/top/10');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const topInfo = result.sessions.map((s, index) => 
                        `${index + 1}. Sesión ${s.id}: ${s.wait_time} min (${s.queue_id})`
                    ).join('\\n');
                    
                    alert(`🏆 Top Sesiones Boca Juniors:\\n\\n${topInfo}`);
                } else {
                    showNotification('❌ No hay sesiones disponibles', 'error');
                }
            } catch (error) {
                showNotification('❌ Error obteniendo ranking', 'error');
                console.error('Error:', error);
            }
        }

        // Enfocar sesión específica
        async function focusSession(sessionId) {
            try {
                const response = await fetch(`/api/focus/${sessionId}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    showNotification(`👁️ Sesión ${sessionId} enfocada`, 'success');
                } else {
                    showNotification('❌ Error enfocando sesión', 'error');
                }
            } catch (error) {
                showNotification('❌ Error enfocando sesión', 'error');
                console.error('Error:', error);
            }
        }

        // Actualizar sesión específica
        async function refreshSession(sessionId) {
            try {
                const response = await fetch(`/api/refresh/${sessionId}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    showNotification(`🔄 Sesión ${sessionId} actualizada`, 'success');
                    refreshData();
                } else {
                    showNotification('❌ Error actualizando sesión', 'error');
                }
            } catch (error) {
                showNotification('❌ Error actualizando sesión', 'error');
                console.error('Error:', error);
            }
        }

        // Cerrar sesión específica
        async function closeSession(sessionId) {
            try {
                const response = await fetch(`/api/close/${sessionId}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    // ✅ LIMPIAR TRACKING DE VENTANA UI TAMBIÉN
                    try {
                        await fetch(`/api/clear_ui_tracking/${sessionId}`, {
                            method: 'POST'
                        });
                    } catch (trackingError) {
                        console.warn('Error limpiando tracking UI:', trackingError);
                    }
                    
                    showNotification(`❌ Sesión ${sessionId} cerrada correctamente`, 'success');
                    refreshData(); // Actualizar dashboard
                } else {
                    showNotification(`❌ Error cerrando sesión ${sessionId}: ${result.message}`, 'error');
                }
            } catch (error) {
                showNotification(`❌ Error cerrando sesión ${sessionId}`, 'error');
                console.error('Error:', error);
            }
        }

        // Actualizar datos
        async function refreshData() {
            try {
                const response = await fetch('/api/sessions');
                const data = await response.json();
                
                updateStats(data.stats);
                updateSessions(data.sessions);
                
                // Verificar si todas las sesiones ya tienen tiempo de espera
                if (data.sessions && data.sessions.length > 0) {
                    const sessionsWithoutTime = data.sessions.filter(s => s.wait_time === null);
                    
                    // Si todas las sesiones ya tienen tiempo, detener actualizaciones automáticas
                    if (sessionsWithoutTime.length === 0 && isRunning) {
                        console.log('Todas las sesiones tienen tiempo de espera. Deteniendo actualizaciones automáticas.');
                        stopDataRefresh();
                        showNotification('✅ Todas las sesiones tienen tiempo de espera. Actualizaciones automáticas detenidas.', 'success');
                    }
                }
                
            } catch (error) {
                console.error('Error actualizando datos:', error);
            }
        }

        // Actualización RÁPIDA (solo lee datos de memoria, NO refresca navegadores)
        async function quickRefresh() {
            showNotification('👁️ Consultando datos actuales...', 'info');
            
            try {
                const response = await fetch('/api/sessions');
                const data = await response.json();
                
                updateStats(data.stats);
                updateSessions(data.sessions);
                
                showNotification('✅ Datos actualizados (sin refrescar navegadores)', 'success');
                
            } catch (error) {
                showNotification('❌ Error consultando datos', 'error');
                console.error('Error:', error);
            }
        }

        // Actualización manual FORZADA (refresca navegadores en PARALELO)
        async function manualRefresh() {
            showNotification('⚡ Forzando actualización de TODAS las sesiones en paralelo...', 'info');
            
            try {
                // Llamar al endpoint de forzado que refresca los navegadores
                const forceResponse = await fetch('/api/force_update_all', {
                    method: 'POST'
                });
                const forceResult = await forceResponse.json();
                
                if (forceResult.status === 'success') {
                    showNotification(`✅ ${forceResult.message}`, 'success');
                    
                    // Esperar un poco y luego actualizar la UI con los nuevos datos
                    setTimeout(async () => {
                        const response = await fetch('/api/sessions');
                        const data = await response.json();
                        
                        updateStats(data.stats);
                        updateSessions(data.sessions);
                    }, 2000); // Esperar 2 segundos para que se procesen los datos
                } else {
                    showNotification('❌ Error en actualización forzada', 'error');
                }
                
            } catch (error) {
                showNotification('❌ Error actualizando datos', 'error');
                console.error('Error:', error);
            }
        }

        // Actualizar estadísticas
        function updateStats(stats) {
            document.getElementById('totalSessions').textContent = stats.total_sessions || 0;
            document.getElementById('activeSessions').textContent = stats.active_sessions || 0;
            document.getElementById('waitingSessions').textContent = stats.waiting_sessions || 0;
            document.getElementById('readySessions').textContent = stats.ready_sessions || 0;
            document.getElementById('bestTime').textContent = stats.best_time ? `${stats.best_time} min` : '--';
            document.getElementById('avgTime').textContent = stats.avg_time ? `${stats.avg_time} min` : '--';
            
            // Actualizar countdown
            const countdownElement = document.getElementById('countdown');
            if (stats.countdown) {
                if (stats.countdown === '¡ABIERTO!') {
                    countdownElement.textContent = '🟢 ' + stats.countdown + ' - ¡DALE BOCA!';
                    countdownElement.className = 'countdown open';
                } else {
                    countdownElement.textContent = '⏰ Apertura en: ' + stats.countdown;
                    countdownElement.className = 'countdown';
                }
            }
        }

        // Actualizar sesiones
        function updateSessions(sessions) {
            const grid = document.getElementById('sessionsGrid');
            
            if (!sessions || sessions.length === 0) {
                grid.innerHTML = `
                    <div class="loading">
                        <div class="loading-pulse">
                            💙 Esperando sesiones xeneize... 💛
                        </div>
                    </div>
                `;
                return;
            }

            // Encontrar mejor sesión
            const activeSessions = sessions.filter(s => s.wait_time !== null);
            const bestSession = activeSessions.length > 0 ? 
                activeSessions.reduce((best, current) => 
                    current.wait_time < best.wait_time ? current : best
                ) : null;

            grid.innerHTML = sessions.map(session => `
                <div class="session-card ${bestSession && session.id === bestSession.id ? 'best' : ''}">
                    <div class="session-header">
                        <div class="session-title">
                            <span class="status-indicator ${session.status !== 'error' ? 'online' : 'offline'}"></span>
                            Sesión ${session.id}
                        </div>
                        <div class="session-status status-${session.status}">
                            ${getStatusText(session.status)}
                        </div>
                    </div>
                    
                    <div class="session-info">
                        <div class="session-info-item">
                            <span class="session-info-label">🎫 Queue ID:</span>
                            <span class="session-info-value">
                                <span class="queue-id">${session.queue_id || 'Obteniendo...'}</span>
                            </span>
                        </div>
                        <div class="session-info-item">
                            <span class="session-info-label">⏰ Tiempo de Espera:</span>
                            <span class="session-info-value wait-time">
                                ${session.wait_time ? `${session.wait_time} min` : '--'}
                            </span>
                        </div>
                        <div class="session-info-item">
                            <span class="session-info-label">📝 Texto Original:</span>
                            <span class="session-info-value raw-text" style="font-style: italic; color: #666; font-size: 0.9em; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${session.raw_time_text || 'Sin texto'}">
                                ${session.raw_time_text || 'Sin texto'}
                            </span>
                        </div>
                        <div class="session-info-item">
                            <span class="session-info-label">🔄 Última Actualización:</span>
                            <span class="session-info-value">${session.last_update || '--'}</span>
                        </div>
                    </div>
                    
                    ${session.full_url ? `
                    <div style="margin: 20px 0; padding: 15px; background: linear-gradient(145deg, ${session.full_url.includes('queueittoken') ? '#fff8e1, #fffbf0' : '#f5f5f5, #e8e8e8'}); border: 3px solid ${session.full_url.includes('queueittoken') ? '#ffd700' : '#999'}; border-radius: 15px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span style="font-weight: 700; color: #005ca9; text-transform: uppercase; letter-spacing: 1px;">
                                ${session.full_url.includes('queueittoken') ? '🔗 Link con Token:' : '📍 URL Actual:'}
                            </span>
                            ${session.full_url.includes('queueittoken') ? `
                            <button class="btn btn-success btn-sm" onclick="copyToClipboard('${session.full_url.replace(/'/g, "\\'")}', ${session.id})" style="padding: 8px 15px; font-size: 12px;">
                                📋 Copiar Link
                            </button>
                            ` : `
                            <button class="btn btn-sm" onclick="copyToClipboard('${session.full_url.replace(/'/g, "\\'")}', ${session.id})" style="padding: 8px 15px; font-size: 12px; background: #999; color: white;">
                                📋 Copiar URL
                            </button>
                            `}
                        </div>
                        <div style="font-family: 'Courier New', monospace; font-size: 11px; color: #666; word-break: break-all; background: white; padding: 10px; border-radius: 8px; max-height: 60px; overflow-y: auto;">
                            ${session.full_url}
                        </div>
                        <div style="margin-top: 10px; font-size: 12px; color: ${session.full_url.includes('queueittoken') ? '#005ca9' : '#666'}; font-weight: 600; text-align: center;">
                            ${session.full_url.includes('queueittoken') ? '💡 Copia este link y ábrelo en tu navegador personal' : '⏳ Esperando token de Queue-it...'}
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="session-actions">
                        <button class="btn btn-primary btn-sm" onclick="focusSession(${session.id})">
                            👁️ Abrir
                        </button>
                        <button class="btn btn-warning btn-sm" onclick="refreshSession(${session.id})">
                            🔄 Actualizar
                        </button>
                        <button class="btn btn-danger btn-sm ${session.wait_time && session.wait_time > 45 ? 'btn-highlight' : ''}" onclick="closeSession(${session.id})" title="Cerrar sesión con tiempo: ${session.wait_time || '--'} min">
                            ❌ Cerrar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Obtener texto de estado
        function getStatusText(status) {
            const statusTexts = {
                'waiting': 'Esperando',
                'active': 'En Cola',
                'ready': 'Listo',
                'error': 'Error'
            };
            return statusTexts[status] || 'Desconocido';
        }

        // Iniciar actualización automática
        function startDataRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            
            refreshInterval = setInterval(() => {
                if (isRunning) {
                    refreshData();
                }
            }, 15000); // Actualizar cada 15 segundos
        }

        // Detener actualización automática
        function stopDataRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', function() {
            // Actualizar datos iniciales
            refreshData();
            
            // Configurar actualización automática (más lenta cuando no hay sesiones)
            setInterval(() => {
                if (!isRunning) {
                    refreshData();
                }
            }, 30000); // Solo actualizar cada 30 segundos cuando no hay sesiones activas
        });

        // Abrir mejores sesiones en UI
        async function openBestUI(count) {
            try {
                const response = await fetch(`/api/open_best_ui/${count}`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    showNotification(`🖥️ ${result.message}`, 'success');
                } else {
                    showNotification('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showNotification('❌ Error abriendo sesiones en UI', 'error');
                console.error('Error:', error);
            }
        }

        // Manejar cierre de página
        window.addEventListener('beforeunload', function() {
            if (isRunning) {
                stopSessions();
            }
        });
    </script>
</body>
</html>
